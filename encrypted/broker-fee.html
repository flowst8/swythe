<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Caregiver Guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="cache-control" content="max-age=0">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e293b;
  }

  .access-box {
    background: white;
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 360px;
    width: 90%;
    text-align: center;
    box-shadow: 0 24px 64px rgba(0,0,0,0.3);
  }

  .access-box h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    color: #1e293b;
    margin-bottom: 8px;
  }

  .access-box p.subtitle {
    color: #64748b;
    font-size: 0.9rem;
    margin-bottom: 32px;
  }

  .staticrypt-password-container {
    position: relative;
    margin-bottom: 12px;
  }

  #staticrypt-password {
    width: 100%;
    padding: 14px 40px 14px 16px;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    color: #1e293b;
    outline: none;
    letter-spacing: 0.1em;
    text-align: center;
    transition: border-color 0.2s;
    background: white;
  }

  #staticrypt-password:focus { border-color: #1e293b; }

  .staticrypt-toggle-password-visibility {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    opacity: 0.35;
    width: 20px;
    height: 20px;
  }

  .staticrypt-decrypt-button {
    width: 100%;
    padding: 14px;
    background: #1e293b;
    color: white;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-bottom: 12px;
  }

  .staticrypt-decrypt-button:hover { opacity: 0.85; }

  label.staticrypt-remember {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 0.82rem;
    color: #94a3b8;
    margin-top: 4px;
    cursor: pointer;
  }

  .staticrypt-remember input[type="checkbox"] {
    transform: scale(1.2);
    accent-color: #1e293b;
  }

  .hidden { display: none !important; }

  #staticrypt_loading {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .staticrypt-spinner {
    display: inline-block;
    width: 2rem;
    height: 2rem;
    border: 0.25em solid #e2e8f0;
    border-right-color: #1e293b;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }

  @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
